# Render Blueprint Specification for Praveen Rai Portfolio
# Documentation: https://render.com/docs/blueprint-spec

services:
  # -----------------------------------------------------------
  # 1. Backend Web Service (Node.js + Express + Mongoose + JWT)
  # -----------------------------------------------------------
  - type: web
    name: portfolio-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: COOKIE_EXPIRE
        value: 7
      - key: CLIENT_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: ADMIN_NAME
        value: Praveen Rai
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # -----------------------------------------------------------
  # 2. Frontend Static Site (React 18 + Vite + Tailwind CSS)
  # -----------------------------------------------------------
  - type: static
    name: portfolio-frontend
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
